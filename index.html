<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài Hát Của Minh Khuê</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2B2540; --muted:#7A7195; --pink:#FF3D7F; --bg:#FFF6E9; --card:#FFFFFF; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink); background:var(--bg);
    font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    background-image:
      radial-gradient(circle at 8% 12%, #FFE066 0 40px, transparent 41px),
      radial-gradient(circle at 92% 8%, #7FE3FF 0 60px, transparent 61px),
      radial-gradient(circle at 96% 70%, #FFB6D5 0 50px, transparent 51px);
    background-attachment:fixed;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:32px 16px 64px}

  header{text-align:center;margin-bottom:24px}
  .logo{font-size:64px;line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
  h1{margin:4px 0 0;font-size:clamp(34px,6vw,60px);line-height:1.05;font-weight:800}
  h1 span{display:inline-block}
  h1 span:nth-child(1){color:#FF5A5A} h1 span:nth-child(2){color:#FF9F43}
  h1 span:nth-child(3){color:#3FB950} h1 span:nth-child(4){color:#4FB3FF}
  h1 span:nth-child(5){color:#9B6BFF}
  .sub{margin:4px 0 0;color:var(--muted);font-size:18px}

  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:20px 0 8px}
  .search{
    flex:1 1 260px; max-width:420px; height:52px; padding:0 20px; border:3px solid #EADFF5;
    border-radius:999px; font:inherit; font-size:18px; color:var(--ink); background:#fff; outline:none;
  }
  .search:focus{border-color:var(--pink)}
  .btn{
    height:52px; padding:0 22px; border:0; border-radius:999px; cursor:pointer;
    font:inherit; font-size:18px; font-weight:800; color:#fff; background:var(--pink);
    box-shadow:0 4px 0 rgba(43,37,64,.2); transition:transform .15s;
  }
  .btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(1px)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 20px}
  .chip{
    border:0; cursor:pointer; padding:6px 14px; border-radius:999px; font:inherit; font-size:16px;
    font-weight:600; color:var(--ink); background:#fff; box-shadow:0 2px 0 rgba(43,37,64,.12);
  }
  .chip.on{background:var(--ink);color:#fff}
  .count{text-align:center;color:var(--muted);margin:0 0 16px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin:0;padding:0;list-style:none}
  .card{
    display:flex; flex-direction:column; height:100%; text-decoration:none; color:inherit;
    background:var(--card); border-radius:28px; overflow:hidden;
    box-shadow:0 6px 0 rgba(43,37,64,.12); transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .card:hover,.card:focus-visible{transform:translateY(-6px) rotate(-1deg)}
  .card:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
  .thumb{position:relative;aspect-ratio:16/10;display:grid;place-items:center;background:var(--c)}
  .thumb::after{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 55%)}
  .emoji{font-size:84px;line-height:1;transition:transform .3s}
  .card:hover .emoji{transform:scale(1.15) rotate(-8deg)}
  .no{position:absolute;left:14px;top:12px;z-index:1;min-width:36px;height:36px;padding:0 10px;border-radius:999px;
      display:grid;place-items:center;background:#fff;font-weight:800;font-size:18px}
  .play{position:absolute;right:14px;bottom:12px;z-index:1;width:52px;height:52px;border-radius:50%;
        display:grid;place-items:center;background:var(--pink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .play svg{width:24px;height:24px;fill:#fff;margin-left:3px}
  .body{padding:14px 18px 18px}
  .title{margin:0;font-size:24px;line-height:1.15;font-weight:800}
  .desc{margin:4px 0 10px;color:var(--muted);font-size:16px;line-height:1.35}
  .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;font-weight:600}
  .meta span{padding:2px 10px;border-radius:999px;background:#F3EEFA}
  .empty{text-align:center;font-size:20px;color:var(--muted);padding:40px 0}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🎵</div>
    <h1><span>Bài</span> <span>hát</span> <span>của</span> <span>Minh</span> <span>Khuê</span></h1>
    <p class="sub">Chạm vào một bài để hát và nhảy cùng nhau nhé!</p>
  </header>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="🔍 Tìm bài hát…" aria-label="Tìm bài hát">
    <button class="btn" id="random">🎲 Bài bất kỳ</button>
  </div>
  <div class="chips" id="chips"></div>
  <p class="count" id="count"></p>
  <ul class="grid" id="grid"></ul>
</div>

<script src="songs/songs.js"></script>
<script>
(() => {
  'use strict';
  const songs = (window.SONGS || []).slice().sort((a, b) => a.no - b.no);
  const $ = id => document.getElementById(id);
  const ALL = 'Tất cả';
  let tag = ALL;

  // Bỏ dấu để tìm "nhen" vẫn ra "nhện"
  const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

  const tags = [ALL, ...new Set(songs.flatMap(s => s.tags || []))];
  function renderChips() {
    $('chips').innerHTML = tags.map(t =>
      `<button class="chip${t === tag ? ' on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
  }

  function render() {
    const q = fold($('q').value.trim());
    const list = songs.filter(s =>
      (tag === ALL || (s.tags || []).includes(tag)) &&
      (!q || fold([s.title, s.desc, ...(s.tags || [])].join(' ')).includes(q)));
    $('count').textContent = `${list.length} / ${songs.length} bài hát`;
    $('grid').innerHTML = list.length ? list.map(s => `
      <li><a class="card" href="${esc(s.file)}">
        <div class="thumb" style="--c:${esc(s.color || '#FFD98C')}">
          <span class="no">${esc(s.no)}</span>
          <span class="emoji" aria-hidden="true">${esc(s.emoji || '🎵')}</span>
          <span class="play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></span>
        </div>
        <div class="body">
          <h2 class="title">${esc(s.title)}</h2>
          ${s.desc ? `<p class="desc">${esc(s.desc)}</p>` : ''}
          <div class="meta">${s.duration ? `<span>⏱ ${esc(s.duration)}</span>` : ''}${(s.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
        </div>
      </a></li>`).join('') : '<li class="empty">Chưa có bài nào khớp 🙈</li>';
  }

  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    tag = b.dataset.tag;
    renderChips(); render();
  });
  $('q').addEventListener('input', render);
  $('random').addEventListener('click', () => {
    if (songs.length) location.href = songs[Math.floor(Math.random() * songs.length)].file;
  });

  renderChips(); render();
})();
</script>
</body>
</html>
